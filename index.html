<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Open VTT</title>
</head>
<body>
    <p>Redirigiendo a Open VTT...</p>

    <script>
        const urlFile =
            "https://raw.githubusercontent.com/Rantifusa/open-vtt/main/url.txt?t=" +
            Date.now();

        fetch(urlFile, { cache: "no-store" })
            .then(response => {
                if (!response.ok) {
                    throw new Error("No se pudo leer url.txt");
                }

                return response.text();
            })
            .then(url => {
                url = url.trim().replace(/\/+$/, "");

                window.location.replace(url + "/lobby");
            })
            .catch(() => {
                document.body.innerHTML =
                    "<p>No se pudo obtener la dirección de Open VTT.</p>";
            });
    </script>
</body>
</html>
